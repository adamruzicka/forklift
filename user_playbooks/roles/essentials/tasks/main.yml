- name: 'Enable CRB'
  become: true
  command: dnf config-manager --set-enabled crb
  when: ansible_distribution != 'RedHat'

# TODO: Dynamic repo name
- name: 'Enable CRB (RHEL)'
  become: true
  rhsm_repository:
    name: "codeready-builder-for-rhel-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}-rpms"
    state: enabled
  when: ansible_distribution == 'RedHat'

- name: 'Update the system'
  become: true
  dnf:
    name: '*'
    state: latest
  ignore_errors: true

- name: 'Install the development tools package group'
  become: true
  yum:
    name: "@Development Tools"
    state: present

- name: 'Install the virtualization tools package group'
  become: true
  yum:
    name: "@Virtualization Tools"
    state: present

- name: 'Install langs and deps'
  become: true
  package:
    name:
      - 'vim'
      - 'git'
      - 'ruby-devel'
      - 'python3-devel'
      - 'libyaml-devel'
    state: installed

- name: 'Install websockify'
  become: true
  command: pip3 install websockify

- name: 'Install rexml gem'
  become: true
  command: gem install rexml

- name: 'Install rexml gem'
  command: gem install rexml

- name: 'etc hosts'
  become: true
  lineinfile:
    dest: /etc/hosts
    regexp: "127.0.1.1 .*"
    state: absent

- name: 'add hostname to etc hosts'
  become: true
  lineinfile:
    dest: /etc/hosts
    line: "{{ ansible_default_ipv4.address }} {{ foreman_machine_hostname }}"

- name: 'Pretty terminal'
  blockinfile:
    path: ~/.bashrc
    block: |
      git_branch () {
        git rev-parse --abbrev-ref HEAD 2>/dev/null
      }
      export PS1='\[\e[38;5;81m\]\w\n\[\e[38;5;202m\]$(git branch 2>/dev/null | grep '"'"'*'"'"' | colrm 1 2)\n\[\e[38;5;213m\]\u@\H \[\e[38;5;202m\]> \[\e[0m\]'

- name: 'Config bash aliases'
  lineinfile:
    path: ~/.bashrc
    line: "alias {{ item.key }}='{{ item.value }}'"
    insertafter: alias.*
  loop: "{{ entries | dict2items }}"
  vars:
    entries:
      'hm': "BUNDLE_GEMFILE={{ ansible_user_dir }}/hammer-cli/Gemfile bundle exec hammer"
      'be': "bundle exec"
      'bers': "bundle exec rails server"
      'befs': "bundle exec foreman start"
      'bercs': "bundle exec rails console --sandbox"
      'befsp': "RAILS_SERVE_STATIC_FILES=true RAILS_ENV=production NODE_ENV=production bundle exec foreman start"

- name: 'GH API token'
  lineinfile:
    path: ~/.github_api_token
    line: "{{ github_api_token }}"
    create: yes
  when: github_api_token is defined

- name: 'Transifex config'
  blockinfile:
    dest: ~/.transifexrc
    create: true
    block: |
      [https://app.transifex.com]
      api_hostname = https://api.transifex.com
      hostname = https://app.transifex.com
      password = {{ transifex_api_token }}
      username = api
      token = {{ transifex_api_token }}
      rest_hostname = https://rest.api.transifex.com
  when: transifex_api_token is defined

# Git configurations
- name: 'Configure git'
  git_config:
    name: "{{ item.key }}"
    scope: global
    value: "{{ item.value }}"
  loop: "{{ entries | dict2items }}"
  vars:
    entries:
      "user.name": "{{ git_name }}"
      "user.email": "{{ git_email }}"
      "alias.ci": commit
      "alias.st": status
      "alias.co": checkout
      "pull.ff": true
      'url."git@github.com:".pushInsteadOf': 'https://github.com/'

- name: 'Copy local private SSH key to guest for user'
  copy:
    src: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
    dest: "{{ ansible_user_dir }}/.ssh/id_ed25519"
    mode: 0600
  when: local_username is defined

- name: 'Copy local public SSH key to guest for user'
  copy:
    src: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
    dest: "{{ ansible_user_dir }}/.ssh/id_ed25519.pub"
    mode: 0644
  when: local_username is defined

- name: 'Copy local private SSH key to guest for root user'
  become: true
  copy:
    src: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
    dest: ~/.ssh/id_ed25519
    owner: root
    group: root
    mode: 0600
  when: local_username is defined

- name: 'Copy local public SSH key to guest for root user'
  become: true
  copy:
    src: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
    dest: ~/.ssh/id_ed25519.pub
    owner: root
    group: root
    mode: 0644
  when: local_username is defined

- name: 'Start ssh-agent and add the private key'
  become: true
  shell: |
    eval $(ssh-agent)
    ssh-add ~/.ssh/id_ed25519
  when: local_username is defined

- name: Ensure github.com is a known host
  become: true
  lineinfile:
    dest: /root/.ssh/known_hosts
    create: yes
    state: present
    line: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 github.com') }}"
    regexp: "^github\\.com"

- name: Ensure github.com is a known host
  lineinfile:
    dest: "{{ ansible_user_dir }}/.ssh/known_hosts"
    create: yes
    state: present
    line: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 github.com') }}"
    regexp: "^github\\.com"
